{% extends "base.html" %}
{% block title %}Edit Profile | Event Aggregator{% endblock %}

{% block content %}

<style>

/* MAIN CONTAINER */
.edit-container {
    max-width: 900px;
    margin: 40px auto;
    padding: 35px;
    border-radius: 20px;

    background: linear-gradient(135deg, #1b1724, #0f1720);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 0 25px rgba(57,255,218,0.12);
}

/* TITLE */
.shine {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent-teal);
    margin-bottom: 20px;
    text-shadow: 0 0 12px rgba(57,255,218,0.45);
}

/* INPUT FIELDS */
input.form-control {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    color: var(--text-primary);
    margin-top: 8px;
    transition: 0.25s;
}

input.form-control:focus {
    border-color: var(--accent-purple);
    box-shadow: 0 0 12px rgba(138,91,255,0.35);
}

.mb-3 label {
    color: var(--accent-purple);
    font-weight: 700;
    margin-bottom: 6px;
}

/* AVATAR GRID */
.avatar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 18px;
    margin-top: 20px;
}

.avatar-item {
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border: 2px solid rgba(255,255,255,0.04);
    border-radius: 14px;
    cursor: pointer;
    transition: 0.25s;
    text-align: center;
}

.avatar-item:hover {
    border-color: var(--accent-purple);
    box-shadow: 0 0 12px rgba(138,91,255,0.35);
}

.avatar-selected {
    border-color: var(--accent-teal) !important;
    box-shadow: 0 0 18px rgba(57,255,218,0.45) !important;
}

.avatar-item img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
}

/* SAVE BUTTON */
.btn-success {
    background: var(--gradient-primary) !important;
    border: none !important;
    padding: 12px 26px;
    border-radius: 14px;
    font-weight: 700;
    color: #04111a !important;
    box-shadow: var(--glow);
    transition: 0.25s;
}

.btn-success:hover {
    transform: translateY(-3px);
    filter: brightness(1.12);
}

/* RESPONSIVE */
@media (max-width: 850px) {
    .edit-container {
        padding: 25px;
    }

    .avatar-grid {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    }
}

</style>


<div class="edit-container">

    <h2 class="shine">Edit Profile</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" name="full_name" class="form-control form" value="{{ user.full_name }}" required>
        </div>

        <div class="mb-3">
            <label>College</label>
            <input type="text" name="college_name" class="form-control" value="{{ user.college_name }}" required>
        </div>

        <div class="mb-3">
            <label>Department</label>
            <input type="text" name="department" class="form-control" value="{{ user.department }}" required>
        </div>

        {% if user.role == "organizer" %}
        <div class="mb-3">
            <label>Club Name</label>
            <input type="text" name="club_name" class="form-control" value="{{ user.club_name }}">
        </div>
        {% endif %}

        <hr>
        <h4>Select Avatar</h4>

       <div class="avatar-grid">
    {% for avatar in avatars %}
    <label class="avatar-item {% if avatar == user.avatar %}avatar-selected{% endif %}">
        
        <input type="radio" 
               name="avatar" 
               value="{{ avatar }}"  
               {% if avatar == user.avatar %}checked{% endif %}
               style="display:none;">
        
        <img src="{{ url_for('static', filename='avatars/' ~ avatar) }}">
    </label>
    {% endfor %}
</div>


        <button class="btn btn-success mt-4" type="submit">Save Changes</button>

    </form>
</div>

<script>
document.querySelectorAll(".avatar-item").forEach(item => {
    item.addEventListener("click", () => {
        document.querySelectorAll(".avatar-item")
            .forEach(i => i.classList.remove("avatar-selected"));
        item.classList.add("avatar-selected");
        item.querySelector("input").checked = true;
    });
});
</script>

{% endblock %}
